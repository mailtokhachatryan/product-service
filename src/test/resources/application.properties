spring.datasource.url=jdbc:h2:mem:product_service_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.security.user-password=test-user-password
app.security.admin-password=test-admin-password
app.security.client-secret=test-client-secret
