spring.application.name=product-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_service}
spring.datasource.username=${DB_USERNAME:product_service}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.security.user-password=${APP_USER_PASSWORD}
app.security.admin-password=${APP_ADMIN_PASSWORD}
app.security.client-secret=${OAUTH_CLIENT_SECRET}
